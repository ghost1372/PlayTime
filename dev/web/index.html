.tid { color: var(--muted); font-family: "SFMono-Regular", Consolas, monospace; font-size: .76rem; letter-spacing: .05em; }

.empty { padding: 2.34rem .78rem; text-align: center; color: var(--muted); font-size: 1rem; }
.empty.err { color: var(--red); }
.skel { height: 17rem; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }

.toast { position: fixed; left: 50%; bottom: 2rem; padding: .624rem 1.092rem; opacity: 0; pointer-events: none; z-index: 30; transform: translate(-50%, 1rem); transition: all .25s; color: var(--text); font-size: .9rem; font-weight: 600; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--solid); box-shadow: var(--shadow-pop); }

footer { margin-top: auto; padding-top: 1.1rem; text-align: center; color: var(--muted); font-size: .8rem; }

.overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 20; padding: .78rem; align-items: center; justify-content: center; overflow-y: auto; background: var(--overlay); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }

#mUsers .ilast { display: inline-block; margin: .25rem 0 0 -2px; padding: .1rem .65rem; text-align: left; color: var(--muted); font-size: .74rem; font-weight: 600; line-height: 1.35; background: var(--inset); border: 1px solid var(--line); border-radius: 6px; }
.modal .ival { box-sizing: border-box; width: 17rem; margin-left: 0; text-align: center; padding: .18rem .65rem; color: var(--green); font-size: .82rem; font-weight: 700; background: var(--played-bg); border: 1px solid var(--played-line); border-radius: 6px; }
.modal .ival.dim { color: var(--red); background: var(--never-bg); border-color: var(--never-line); }

.mtotal.zero { color: var(--red); background: var(--never-bg); border-color: var(--never-line); }
.mstamps { display: flex; flex-wrap: wrap; margin-top: .25rem; }
.mstamp { margin: 0 .4rem .2rem 0; padding: .06rem .4rem; font-size: .72rem; font-weight: 800; letter-spacing: .1em; line-height: 1.4; color: var(--accent); border: 2px solid var(--accent); border-radius: 3px; background: var(--badge-bg); }
.mstamp.ps4 { color: var(--amber); border-color: var(--amber); }

.ebtn { flex: 0 0 auto; margin-left: .5rem; padding: .3rem .75rem; cursor: pointer; color: var(--text); font: inherit; font-size: .85rem; font-weight: 600; white-space: nowrap; background: var(--fill); border: 1px solid var(--line-strong); border-radius: var(--rc); }
.ebtn:hover { background: var(--fill-hover); }
.ebtn:focus { outline: none; }
.ebtn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.editor { margin: 0 0 .234rem; padding: .5rem; border: 1px solid var(--line); border-radius: var(--r); background: var(--inset); }
.efields { display: grid; grid-template-columns: 1fr 1fr; grid-gap: .5rem; }
.efield { min-width: 0; padding: .45rem .6rem .55rem; background: var(--fill); border: 1px solid var(--line); border-radius: var(--r); }
.elabel { margin-bottom: .25rem; color: var(--muted); font-size: .8rem; font-weight: 600; }

.evalue small { margin-left: .39rem; color: var(--muted); font-size: .85rem; font-weight: 600; }
.equick { display: flex; margin-top: .3rem; }
.qbtn { flex: 1 1 0; margin-right: .3rem; padding: .3rem .2rem; font-size: .85rem; }
.qbtn:last-child { margin-right: 0; }

.esum b { color: var(--green); }
.eact { display: flex; flex: 0 0 auto; }
.eact .refresh { margin: 0 .468rem 0 0; }
.eact .refresh:last-child { margin-right: 0; }
.enote { margin: 0 0 .312rem; color: var(--muted); font-size: .8rem; }
.mbtns { display: flex; flex-wrap: wrap; margin-top: .5rem; }
.mbtns .refresh { flex: 1 1 auto; width: 100%; margin: 0; }

/* keyboard / controller focus: clear double ring */
.tab:focus, .theme:focus, .chip:focus, .refresh:focus, .qbtn:focus, .sbtn:focus, .item:focus, .search:focus, .sclear:focus, .card:focus, .credit a:focus { outline: none; }
.theme:focus-visible, .chip:focus-visible, .sclear:focus-visible, .refresh:focus-visible, .qbtn:focus-visible, .sbtn:focus-visible, .item:focus-visible-visible-visible, .credit a:focus-visible {
  outline: none; box-shadow: 0 0 0 2px var(--accent);
}

@media (max-width: 560px) {
  .page { padding: .936rem .702rem 1.95rem; }
  .total { padding: .936rem; }
  .big { font-size: 1.3rem; }
  .totalbox { text-align: left; }
  .totalbox .eyebrow { text-align: left; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); grid-gap: .468rem; }

  .efields { grid-template-columns: 1fr; }

}

</head>
<body>
<div class="page">
  <div class="topline">
    <span class="pills">
      <span class="pill live"><i></i><span id="fw">PS5</span></span>
      <span class="pill"><span class="pl">Access</span><span class="addr" id="addr"></span></span>
    </span>
    <span class="tright">
      <span class="seg" id="tfmt" role="radiogroup" aria-label="Time format">
        <button type="button" role="radio" data-f="dhm">Day, Hour, Minute</button>
        <button type="button" role="radio" data-f="hm">Hour, Minute</button>
        <button type="button" role="radio" data-f="h">Hour</button>
      </span>
      <button class="theme" id="theme" type="button" role="switch" aria-checked="true" aria-label="Dark theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="track"><i></i></span>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </span>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab on" id="tabDash" type="button" role="tab" aria-selected="true">Dashboard</button>
    <button class="tab" id="tabTop" type="button" role="tab" aria-selected="false">Top games</button>
  </div>

  <section class="overview">
    <div class="box total" id="vDash">
      <div class="hero">
        <div class="hmain">
          <div class="head">
            <div class="brand">
              <div class="mark">P</div>
              <div>
                <h1><span id="appName"></span> <span class="ver" id="ver"></span></h1>
                <p class="sub" id="tagline"></p>
              </div>
            </div>
            <div class="totalbox">
              <p class="eyebrow">Total play time</p>
              <div class="big" id="totalTime">-</div>
              <p class="sub" id="totalSub">&nbsp;</p>
            </div>
          </div>
          <div class="slot" id="heroSlot"><div class="uchart" id="uChart"></div></div>
          <div class="tiles">
            <div class="tile sm"><b id="tGames">-</b><span>Games</span></div>
            <div class="tile sm"><b id="tPlayed">-</b><span>Played</span></div>
            <div class="tile sm"><b id="tNever">-</b><span>Not played</span></div>
            <div class="tile wide"><b id="tAvg">-</b><span>Average / played game</span></div>
          </div>
        </div>
        <div class="hside">
          <h2>Play time by user</h2>
          <div id="pUsers"></div>
          <h2 class="gap">By platform</h2>
          <div id="pPlat"></div>
        </div>
      </div>
    </div>
    <div class="box panel" id="vTop" style="display:none"><div class="cols" id="pTop"></div></div>
  </section>

  <div id="gamesArea">
  <div class="toolbar">
    <div class="sbox" id="sbox">
      <input id="q" class="search" type="search" placeholder="Search by name or title ID" autocomplete="off">
      <button class="sclear" id="qclear" type="button" aria-label="Clear search" title="Clear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    </div>
    <div class="chips">
      <button class="chip on" data-p="ALL" type="button">ALL</button>
      <button class="chip" data-p="PS5" type="button">PS5</button>
      <button class="chip" data-p="PS4" type="button">PS4</button>
      <button class="chip" id="sort" type="button">SORT: MOST PLAYED</button>
      <button class="chip" id="view" type="button">VIEW: CARDS</button>
      <button class="chip act" id="reload" type="button">Refresh</button>
    </div>
  </div>

  <p class="meta" id="meta">Loading...</p>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none"></div>
  </div>

  <footer>
    <div class="foot">
      <div class="credit" id="credit"></div>
    </div>
  </footer>
</div>

<div class="overlay" id="overlay" style="display:none">
  <div class="box modal" role="dialog" aria-modal="true">
    <div class="mhead">
      <div class="mart" id="mArt"></div>
      <div>
        <h3 class="mname" id="mName"></h3>
        <div class="mstamps" id="mId"></div>
        <div class="mtotal" id="mTotal"></div>
      </div>
    </div>
    <h2 class="eyebrow">Play time by user</h2>
    <div id="mUsers"></div>
    <div class="mbtns">
      <button class="refresh" id="mClose" type="button">Close</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var SORTS = ['played', 'recent', 'name', 'id'];
  var SORT_LABELS = { played: 'MOST PLAYED', recent: 'RECENT', name: 'A-Z', id: 'TITLE ID' };
  var state = { unit: 1, users: [], names: [], games: [], platform: 'ALL', sort: 'played', query: '', maxSec: 0, view: 'cards', tfmt: 'dhm' };
  var grid = document.getElementById('grid');
  var empty = document.getElementById('empty');
  var meta = document.getElementById('meta');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  var openGame = null;
  var lastFocus = null;

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (text !== undefined && text !== null) { n.textContent = text; }
    return n;
  }
  function clear(node) { while (node.firstChild) { node.removeChild(node.firstChild); } }

  /* ---------- theme switch (dark / light) ---------- */
  function applyTheme(t, save) {
    var dark = t !== 'light';
    var btn = $('theme');
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    btn.setAttribute('aria-checked', dark ? 'true' : 'false');
    btn.setAttribute('aria-label', dark ? 'Dark theme' : 'Light theme');
    btn.className = dark ? 'theme dark' : 'theme';
    btn.getElementsByTagName('i')[0].style.left = dark ? '1.25rem' : '.15rem';
    $('themeColor').setAttribute('content', dark ? '#1c1c1f' : '#e6e9f0');
    if (save) { try { localStorage.setItem('pt-theme', dark ? 'dark' : 'light'); } catch (err) {} }
  }
  var lastToggle = 0;
  function toggleTheme() {
    var now = new Date().getTime();
    if (now - lastToggle < 250) { return; }
    lastToggle = now;
    applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light', true);
  }
  $('theme').onclick = toggleTheme;
  document.addEventListener('click', function (e) {
    var n = e.target;
    while (n && n !== document) { if (n.id === 'theme') { toggleTheme(); return; } n = n.parentNode; }
  }, true);
  $('theme').onkeydown = function (e) {
    if (e.key === 'Enter' || e.key === ' ' || e.keyCode === 13 || e.keyCode === 32) { e.preventDefault(); toggleTheme(); }
  };
  applyTheme(document.documentElement.getAttribute('data-theme'), false);

  /* ---------- formatting: only the parts that are not zero ---------- */
  function fmtNum(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function plural(n, one, many) { return fmtNum(n) + ' ' + (n === 1 ? one : many); }

  /* Time format chosen by the user: 'dhm' = days, hours, minutes; 'hm' = hours, minutes; 'h' = hours only */
  function fmtHours(sec) {
    var parts = String(Math.round(sec / 360) / 10).split('.');
    return fmtNum(parts[0]) + (parts[1] ? '.' + parts[1] : '');
  }

  function fmtLong(sec) {
    sec = Math.round(sec);
    if (sec <= 0) { return ''; }
    if (state.tfmt === 'h') { var hh = fmtHours(sec); return hh + (hh === '1' ? ' hour' : ' hours'); }
    var d = state.tfmt === 'hm' ? 0 : Math.floor(sec / 86400);
    var h = state.tfmt === 'hm' ? Math.floor(sec / 3600) : Math.floor((sec % 86400) / 3600);
    var m = Math.floor((sec % 3600) / 60);
    var s = sec % 60;
    var out = [];
    if (d) { out.push(plural(d, 'day', 'days')); }
    if (h) { out.push(plural(h, 'hour', 'hours')); }
    if (m) { out.push(plural(m, 'minute', 'minutes')); }
    if (s && !d && !h && !m) { out.push(plural(s, 'second', 'seconds')); }
    return out.join(', ');
  }

  function fmtDate(ts, withTime) {
    var m = /^(\d{4})-(\d\d)-(\d\d)[ T](\d\d):(\d\d)/.exec(ts || '');
    if (!m) { return ''; }
    var out = MONTHS[parseInt(m[2], 10) - 1] + ' ' + parseInt(m[3], 10) + ', ' + m[1];
    return withTime ? out + ' ' + m[4] + ':' + m[5] : out;
  }

  /* ---------- small ui helpers ---------- */
  function toast(text) {
    toastEl.textContent = text;
    toastEl.className = 'toast show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = 'toast'; }, 1800);
  }

  function showEmpty(text, isError) {
    clear(grid);
    empty.style.display = 'block';
    empty.className = isError ? 'empty err' : 'empty';
    empty.textContent = text;
  }

  function makeArt(game, cls) {
    var art = el('div', cls);
    art.appendChild(el('div', 'ph', (game.name || '?').charAt(0).toUpperCase()));
    var img = document.createElement('img');
    img.alt = '';
    img.onerror = function () { if (img.parentNode) { img.parentNode.removeChild(img); } };
    img.src = '/icon/' + game.id + '.png';
    art.appendChild(img);
    return art;
  }

  /* One list row: lead (rank/icon/avatar), name + optional sub line, value. */
  function makeItem(lead, name, value, sub, onclick, dim) {
    var row = el(onclick ? 'button' : 'div', onclick ? 'item' : 'item static');
    if (onclick) { row.type = 'button'; row.onclick = onclick; }
    var i;
    for (i = 0; i < lead.length; i++) { row.appendChild(lead[i]); }
    var mid = el('div', 'imid');
    mid.appendChild(el('div', 'iname', name));
    if (sub && sub.nodeType) { mid.appendChild(sub); } else if (sub) { mid.appendChild(el('div', 'isub', sub)); }
    row.appendChild(mid);
    row.appendChild(el('div', dim ? 'ival dim' : 'ival', value));
    return row;
  }

  /* Title ID chip (PPSA / CUSA prefix + number), used in every list, card and dialog */
  function idChip(id, cls) {
    var chip = el('div', /^CUSA/.test(id) ? cls + ' ps4' : cls);
    chip.appendChild(el('b', null, id.substring(0, 4)));
    chip.appendChild(document.createTextNode(id.substring(4)));
    return chip;
  }

  /* Top games row: rank, art, name + title ID chip; time pill over last-played chip */
  function makeTopItem(g, n) {
    var row = el('button', 'item');
    row.type = 'button';
    row.onclick = function () { showDetail(g, this); };
    if (n) { row.appendChild(el('span', n < 4 ? 'rank top' : 'rank', n)); }
    row.appendChild(makeArt(g, 'thumb'));
    var mid = el('div', 'imid');
    mid.appendChild(el('div', 'iname', g.name));
    mid.appendChild(idChip(g.id, 'idchip'));
    row.appendChild(mid);
    var right = el('div', 'iright');
    right.appendChild(el('div', g.sec > 0 ? 'ival' : 'ival dim', g.sec > 0 ? fmtLong(g.sec) : 'Not played yet'));
    if (g.lastTs) { right.appendChild(el('div', 'ilast', 'Last played ' + fmtDate(g.lastTs, false))); }
    row.appendChild(right);
    return row;
  }

  function avatar(name, cls) {
    return el('div', cls ? 'avatar ' + cls : 'avatar', (name || '?').charAt(0).toUpperCase());
  }

  /* ---------- data ---------- */
  function prepare(d) {
    var unit = d.unitSeconds || 1;
    var i, k, g;
    state.unit = unit;
    state.users = d.users || [];
    state.names = d.names || [];
    state.games = d.games || [];
    state.maxSec = 0;
    for (i = 0; i < state.games.length; i++) {
      g = state.games[i];
      g.userSec = [];
      g.sec = 0;
      g.lastTs = '';
      for (k = 0; k < state.users.length; k++) {
        var s = (g.played[k] || 0) * unit;
        g.userSec.push(s);
        g.sec += s;
        if (g.last[k] && g.last[k] > g.lastTs) { g.lastTs = g.last[k]; }
      }
      if (g.sec > state.maxSec) { state.maxSec = g.sec; }
    }
  }

  function userLabel(k) {
    return state.names[k] || ('User ' + (k + 1));
  }

  function byPlayed(a, b) {
    if (b.sec !== a.sec) { return b.sec - a.sec; }
    return a.name.toLowerCase() < b.name.toLowerCase() ? -1 : 1;
  }

  function visibleGames() {
    var q = state.query.toLowerCase();
    var list = state.games.filter(function (g) {
      if (state.platform !== 'ALL' && g.platform !== state.platform) { return false; }
      if (!q) { return true; }
      return g.name.toLowerCase().indexOf(q) !== -1 || g.id.toLowerCase().indexOf(q) !== -1;
    });
    list.sort(function (a, b) {
      var x, y;
      if (state.sort === 'played') { return byPlayed(a, b); }
      if (state.sort === 'recent') {
        if (a.lastTs !== b.lastTs) { return a.lastTs < b.lastTs ? 1 : -1; }
        return byPlayed(a, b);
      }
      if (state.sort === 'id') { return a.id < b.id ? -1 : a.id > b.id ? 1 : 0; }
      x = a.name.toLowerCase(); y = b.name.toLowerCase();
      return x < y ? -1 : x > y ? 1 : 0;
    });
    return list;
  }

  /* ---------- dashboard tabs (most played / recent) ---------- */
  var TABS = ['Dash', 'Top'];
  function showTab(which) {
    var i, on;
    for (i = 0; i < TABS.length; i++) {
      on = TABS[i] === which;
      $('v' + TABS[i]).style.display = on ? 'block' : 'none';
      $('tab' + TABS[i]).className = on ? 'tab on' : 'tab';
      $('tab' + TABS[i]).setAttribute('aria-selected', on ? 'true' : 'false');
    }
    $('gamesArea').style.display = which === 'Dash' ? 'block' : 'none';
    try { localStorage.setItem('pt-tab', which); } catch (err) {}
  }
  $('tabDash').onclick = function () { showTab('Dash'); };
  $('tabTop').onclick = function () { showTab('Top'); };
  try { var st = localStorage.getItem('pt-tab'); if (st === 'Top') { showTab(st); } } catch (err) {}


  /* ---------- dashboard ---------- */
  function renderDashboard() {
    var games = state.games;
    var total = 0, played = 0, i, k;
    var plat = { PS5: 0, PS4: 0 };
    var userTotals = [];
    var userGames = [];
    var count = { PS5: 0, PS4: 0 };
    for (k = 0; k < state.users.length; k++) { userTotals.push(0); userGames.push(0); }
    for (i = 0; i < games.length; i++) {
      total += games[i].sec;
      if (games[i].sec > 0) { played++; }
      plat[games[i].platform] += games[i].sec;
      count[games[i].platform]++;
      for (k = 0; k < state.users.length; k++) {
        userTotals[k] += games[i].userSec[k];
        if (games[i].userSec[k] > 0) { userGames[k]++; }
      }
    }

    $('totalTime').textContent = total > 0 ? fmtLong(total) : 'No play time yet';
    $('totalSub').textContent = state.users.length
      ? 'across ' + plural(state.users.length, 'user', 'users') + ' and ' + plural(played, 'game', 'games')
      : 'no user profiles found in app.db';
    $('tGames').textContent = games.length;
    $('tPlayed').textContent = played;
    $('tNever').textContent = games.length - played;
    $('tAvg').textContent = played ? (fmtLong(total / played) || '-') : '-';

    /* most played */
    var top = games.slice().sort(byPlayed).filter(function (g) { return g.sec > 0; }).slice(0, 15);
    var pTop = $('pTop');
    clear(pTop);
    if (!top.length) { pTop.appendChild(el('div', 'none', 'Nothing played yet.')); }
    for (i = 0; i < top.length; i++) {
      (function (g, n) {
        pTop.appendChild(makeTopItem(g, n));
      })(top[i], i + 1);
    }

    /* users */
    var pUsers = $('pUsers');
    clear(pUsers);
    if (!state.users.length) { pUsers.appendChild(el('div', 'none', 'No users found.')); }
    for (k = 0; k < state.users.length; k++) {
      pUsers.appendChild(makeItem([avatar(userLabel(k))], userLabel(k),
        userTotals[k] ? fmtLong(userTotals[k]) : 'none',
        el('span', userGames[k] ? 'gstamp' : 'gstamp zero', plural(userGames[k], 'game', 'games') + ' played'), null, !userTotals[k]));
    }

    renderUserChart(userTotals, total);

    /* platform */
    var pPlat = $('pPlat');
    clear(pPlat);
    pPlat.appendChild(makeItem([el('div', 'avatar sq', 'PS5')], 'PS5 games',
      plat.PS5 ? fmtLong(plat.PS5) : 'none', el('span', count.PS5 ? 'gstamp' : 'gstamp zero', plural(count.PS5, 'game', 'games') + ' installed'), null, !plat.PS5));
    pPlat.appendChild(makeItem([el('div', 'avatar sq amber', 'PS4')], 'PS4 games',
      plat.PS4 ? fmtLong(plat.PS4) : 'none', el('span', count.PS4 ? 'gstamp amber' : 'gstamp zero', plural(count.PS4, 'game', 'games') + ' installed'), null, !plat.PS4));

  }

  /* ---------- user share chart ---------- */
  var CHART_COLORS = ['#60a5fa', '#a78bfa', '#f59e0b', '#34d399', '#f472b6', '#22d3ee', '#f87171', '#a3e635'];
  function svgEl(tag, attrs) {
    var n = document.createElementNS('http://www.w3.org/2000/svg', tag), a;
    for (a in attrs) { n.setAttribute(a, attrs[a]); }
    return n;
  }
  function renderUserChart(userTotals, total) {
    var box = $('uChart');
    if (!box) { return; }
    clear(box);
    var rows = [], k;
    for (k = 0; k < state.users.length; k++) { rows.push({ name: userLabel(k), sec: userTotals[k], color: CHART_COLORS[k % CHART_COLORS.length] }); }
    rows.sort(function (a, b) { return b.sec - a.sec; });
    if (!rows.length || total <= 0) { box.appendChild(el('div', 'none', 'No user play time to chart yet.')); return; }
    var R = 40, C = 2 * Math.PI * R, GAP = rows.length > 1 ? 2 : 0;
    var svg = svgEl('svg', { viewBox: '0 0 100 100', role: 'img', 'aria-label': 'Play time share by user' });
    svg.appendChild(svgEl('circle', { 'class': 'track0', cx: 50, cy: 50, r: R }));
    var offset = 0, segs = [];
    rows.forEach(function (r) {
      if (r.sec <= 0) { return; }
      var len = C * r.sec / total;
      var seg = svgEl('circle', { 'class': 'seg', cx: 50, cy: 50, r: R, stroke: r.color, 'stroke-dasharray': '0 ' + C, 'stroke-dashoffset': -offset });
      var tip = svgEl('title', {});
      tip.textContent = r.name + ': ' + fmtLong(r.sec) + ' (' + Math.round(100 * r.sec / total) + '%)';
      seg.appendChild(tip);
      svg.appendChild(seg);
      segs.push([seg, Math.max(len - GAP, 0.5)]);
      offset += len;
    });
    box.appendChild(svg);
    var legend = el('div', 'ulegend');
    legend.appendChild(el('p', 'ttl', 'Share of play time by user'));
    var shown = rows.slice(0, 5), rest = rows.slice(5), restSec = 0;
    rest.forEach(function (r) { restSec += r.sec; });
    if (rest.length) { shown.push({ name: 'Others (' + rest.length + ')', sec: restSec, color: '#8a8f98' }); }
    shown.forEach(function (r) {
      var row = el('div', 'urow');
      var dot = el('i', '', '');
      dot.style.background = r.color;
      row.appendChild(dot);
      row.appendChild(el('span', 'un', r.name));
      row.appendChild(el('span', 'ut', r.sec ? fmtLong(r.sec) : 'none'));
      row.appendChild(el('span', 'up', Math.round(100 * r.sec / total) + '%'));
      legend.appendChild(row);
    });
    box.appendChild(legend);
    setTimeout(function () {
      segs.forEach(function (p) { p[0].setAttribute('stroke-dasharray', p[1] + ' ' + C); });
    }, 30);
  }

  /* ---------- game grid ---------- */
  function makeCard(game) {
    var card = el('div', 'card');
    card.tabIndex = 0;
    card.setAttribute('role', 'button');

    var art = makeArt(game, 'art');
    var badge = el('span', game.platform === 'PS4' ? 'badge ps4' : 'badge', game.platform);
    art.appendChild(badge);
    art.appendChild(idChip(game.id, 'idchip over'));
    card.appendChild(art);

    var info = el('div', 'info');
    info.appendChild(el('p', 'name', game.name));
    info.appendChild(el('p', game.sec > 0 ? 'time' : 'time zero', game.sec > 0 ? fmtLong(game.sec) : 'Not played yet'));
    card.appendChild(info);
    if (game.lastTs) { info.appendChild(el('p', 'last', 'Last played ' + fmtDate(game.lastTs, false))); }

    card.onclick = function () { showDetail(game, card); };
    card.onkeydown = function (e) {
      if (e.key === 'Enter' || e.key === ' ' || e.keyCode === 13 || e.keyCode === 32) {
        e.preventDefault();
        showDetail(game, card);
      }
    };
    return card;
  }

  function renderGrid() {
    var list = visibleGames();
    meta.textContent = 'Showing ' + list.length + ' of ' + state.games.length + ' games';
    if (!state.games.length) { showEmpty('No installed games were found.', false); return; }
    if (!list.length) { showEmpty('No games match your search.', false); return; }
    empty.style.display = 'none';
    var frag = document.createDocumentFragment();
    for (var i = 0; i < list.length; i++) { frag.appendChild(state.view === 'list' ? makeTopItem(list[i], i + 1) : makeCard(list[i])); }
    grid.className = state.view === 'list' ? 'grid list' : 'grid';
    clear(grid);
    grid.appendChild(frag);
  }

  function showSkeleton() {
    empty.style.display = 'none';
    grid.className = state.view === 'list' ? 'grid list' : 'grid';
    clear(grid);
    for (var i = 0; i < 8; i++) { grid.appendChild(el('div', 'skel')); }
  }

  /* ---------- detail ---------- */
  function showDetail(game, from) {
    var k;
    openGame = game;
    lastFocus = from || null;
    clear($('mArt'));
    var art = makeArt(game, 'mart');
    while (art.firstChild) { $('mArt').appendChild(art.firstChild); }
    $('mName').textContent = game.name;
    clear($('mId'));
    $('mId').appendChild(el('span', game.platform === 'PS4' ? 'mstamp ps4' : 'mstamp', game.platform));
    $('mId').appendChild(idChip(game.id, 'idchip'));
    $('mTotal').textContent = game.sec > 0 ? fmtLong(game.sec) : 'Not played yet';
    $('mTotal').className = game.sec > 0 ? 'mtotal' : 'mtotal zero';

    var box = $('mUsers');
    clear(box);
    if (!state.users.length) { box.appendChild(el('div', 'none', 'No users found.')); }
    for (k = 0; k < state.users.length; k++) {
      var sub = game.last[k] ? 'Last played ' + fmtDate(game.last[k], true) : null;
      var row = makeItem([avatar(userLabel(k))], userLabel(k),
        game.userSec[k] ? fmtLong(game.userSec[k]) : 'Not played', sub ? el('div', 'ilast', sub) : null, null, !game.userSec[k]);
      var ed = (game.has && game.has[k]) ? makeEditor(game, k) : null;
      if (ed) { row.appendChild(ed.btn); }
      box.appendChild(row);
      if (ed) { box.appendChild(ed.panel); }
    }
    closeOpenEditor = null;
    $('overlay').style.display = 'flex';
    $('mClose').focus();
  }

  /* Press once = one step. Hold (mouse or touch) = repeats, getting faster.
     A click with detail 0 comes from the keyboard / controller and is one step
     (holding the key repeats it by itself); mouse and touch are handled by
     the press events below, so their click is ignored to avoid double steps. */
  function holdRepeat(btn, step) {
    var timer = null;
    var ticks = 0;

    function stop() {
      if (timer) { clearTimeout(timer); timer = null; }
    }
    function tick() {
      step();
      ticks++;
      timer = setTimeout(tick, ticks < 8 ? 160 : ticks < 24 ? 80 : 40);
    }
    function start() {
      stop();
      ticks = 0;
      step();
      timer = setTimeout(function () { ticks = 0; tick(); }, 420);
    }

    btn.onmousedown = function (e) {
      if (e.button === 0) { start(); }
    };
    btn.ontouchstart = function (e) {
      e.preventDefault();   /* no emulated mouse / click after a touch */
      start();
    };
    btn.onmouseup = stop;
    btn.onmouseleave = stop;
    btn.ontouchend = stop;
    btn.ontouchcancel = stop;
    btn.onblur = stop;
    btn.oncontextmenu = function (e) { e.preventDefault(); };
    btn.onclick = function (e) {
      if (!e.detail) { step(); }
    };
  }

  function plural2(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

  /* "15 hours 27 minutes" */
  function fmtWords(totalMin) {
    var h = Math.floor(totalMin / 60);
    var m = totalMin % 60;
    return plural2(h, 'hour', 'hours') + ', ' + plural2(m, 'minute', 'minutes');
  }

  /* Edit panel for one user's play time: big - / + buttons (controller and
     touch friendly) for hours and minutes. Minutes roll over into hours.
     Returns { btn, panel }: btn sits on the user's row, panel opens below it. */
  var closeOpenEditor = null;
  function makeEditor(game, k) {
    var start = Math.round(game.userSec[k] / 60);
    var total = start;
    var MAXMIN = 6000000;
    var panel = el('div', 'editor');
    var btn = el('button', 'ebtn', 'Edit play time');
    var hVal = el('div', 'evalue');
    var mVal = el('div', 'evalue');
    var sum = el('div', 'esum');
    var save = el('button', 'refresh primary', 'Save changes');
    var cancel = el('button', 'refresh', 'Cancel');
    btn.type = 'button';
    save.type = 'button';
    cancel.type = 'button';
    panel.style.display = 'none';

    function refresh() {
      var h = Math.floor(total / 60);
      var m = total % 60;
      clear(hVal); clear(mVal); clear(sum);
      hVal.appendChild(document.createTextNode(String(h)));
      hVal.appendChild(el('small', '', h === 1 ? 'hour' : 'hours'));
      mVal.appendChild(document.createTextNode(String(m)));
      mVal.appendChild(el('small', '', m === 1 ? 'minute' : 'minutes'));
      sum.appendChild(document.createTextNode('Currently ' + fmtWords(start) + '. New total: '));
      sum.appendChild(el('b', '', fmtWords(total)));
      sum.appendChild(document.createTextNode('.'));
      save.disabled = (total === start);
    }

    function change(delta) {
      total = Math.max(0, Math.min(MAXMIN, total + delta));
      refresh();
    }

    function stepBtn(label, delta, cls) {
      var b = el('button', cls, label);
      b.type = 'button';
      holdRepeat(b, function () { change(delta); });
      return b;
    }

    function field(title, valueBox, unitMinutes, quick) {
      var f = el('div', 'efield');
      var row = el('div', 'estep');
      var q = el('div', 'equick');
      var i;
      f.appendChild(el('div', 'elabel', title));
      row.appendChild(stepBtn('-', -unitMinutes, 'sbtn'));
      row.appendChild(valueBox);
      row.appendChild(stepBtn('+', unitMinutes, 'sbtn'));
      f.appendChild(row);
      for (i = 0; i < quick.length; i++) {
        q.appendChild(stepBtn((quick[i] > 0 ? '+' : '-') + Math.abs(quick[i] / unitMinutes) +
                              (unitMinutes === 60 ? ' h' : ' min'), quick[i], 'qbtn'));
      }
      f.appendChild(q);
      return f;
    }

    var fields = el('div', 'efields');
    fields.appendChild(field('Hours played', hVal, 60, [-600, -300, 300, 600]));
    fields.appendChild(field('Minutes played (rolls over into hours)', mVal, 1, [-15, -5, 5, 15]));
    panel.appendChild(fields);
    var bar = el('div', 'ebar');
    var act = el('div', 'eact');
    act.appendChild(save);
    act.appendChild(cancel);
    bar.appendChild(sum);
    bar.appendChild(act);
    panel.appendChild(bar);

    function close() {
      panel.style.display = 'none';
      btn.style.display = '';
      if (closeOpenEditor === close) { closeOpenEditor = null; }
    }
    btn.onclick = function () {
      if (closeOpenEditor) { closeOpenEditor(); }
      start = Math.round(game.userSec[k] / 60);
      total = start;
      refresh();
      btn.style.display = 'none';
      panel.style.display = 'block';
      closeOpenEditor = close;
    };
    cancel.onclick = function () { close(); btn.focus(); };
    save.onclick = function () { saveTime(game, k, total * 60, save); };
    return { btn: btn, panel: panel };
  }

  function saveTime(game, k, seconds, button) {
    var value = Math.round(seconds / state.unit);
    button.disabled = true;
    fetch('/api/playtime?id=' + encodeURIComponent(game.id) +
          '&user=' + encodeURIComponent(state.users[k]) + '&value=' + value,
          { method: 'POST', headers: csrfHeaders() })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error) { throw new Error(d.error); }
        game.played[k] = value;
        prepare({ unitSeconds: state.unit, users: state.users, names: state.names, games: state.games });
        renderDashboard();
        renderGrid();
        showDetail(game, lastFocus);
        toast('Play time saved');
      })
      .catch(function (e) {
        button.disabled = false;
        toast((e && e.message) ? e.message : 'Save failed');
      });
  }

  function closeDetail() {
    $('overlay').style.display = 'none';
    openGame = null;
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} }
  }

  /* ---------- loading ---------- */
  function load() {
    meta.textContent = 'Loading...';
    showSkeleton();
    fetch('/api/games', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error) { throw new Error(d.error); }
        prepare(d);
        renderDashboard();
        renderGrid();
      })
      .catch(function (e) {
        meta.textContent = 'Could not load games';
        showEmpty((e && e.message) ? e.message : 'Could not load games.', true);
      });
  }

  var csrfName = '';
  function csrfHeaders() {
    var h = {};
    if (csrfName) { h[csrfName] = '1'; }
    return h;
  }

  function setCredit(author, repo) {
    var c = $('credit');
    var b = document.createElement('b');
    var a = document.createElement('a');
    b.textContent = author;
    a.textContent = repo;
    a.href = repo;
    a.target = '_blank';
    a.rel = 'noopener';
    c.textContent = 'Developed by ';
    c.appendChild(b);
    c.appendChild(document.createTextNode(' - '));
    c.appendChild(a);
  }

  function loadInfo() {
    fetch('/api/info', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        document.title = d.name;
        $('appName').textContent = d.name;
        $('tagline').textContent = d.tagline;
        setCredit(d.author, d.repo);
        csrfName = d.csrf;
        $('fw').textContent = 'PS5 Firmware ' + d.firmware;
        if (d.version) { $('ver').textContent = /^[0-9]/.test(d.version) ? 'v' + d.version : d.version; }
        $('addr').textContent = d.ip + ':' + d.port;
      })
      .catch(function () { $('addr').textContent = location.host; });
  }

  var chips = document.querySelectorAll('.chip[data-p]');
  var ci;
  for (ci = 0; ci < chips.length; ci++) {
    chips[ci].onclick = function () {
      var all = document.querySelectorAll('.chip[data-p]');
      for (var k = 0; k < all.length; k++) { all[k].className = 'chip'; }
      this.className = 'chip on';
      state.platform = this.getAttribute('data-p');
      renderGrid();
    };
  }
  $('sort').onclick = function () {
    state.sort = SORTS[(SORTS.indexOf(state.sort) + 1) % SORTS.length];
    this.textContent = 'SORT: ' + SORT_LABELS[state.sort];
    renderGrid();
  };
  function applyView() { $('view').textContent = 'VIEW: ' + (state.view === 'list' ? 'LIST' : 'CARDS'); }
  try { if (localStorage.getItem('pt-view') === 'list') { state.view = 'list'; } } catch (err) {}
  applyView();
  $('view').onclick = function () {
    state.view = state.view === 'list' ? 'cards' : 'list';
    try { localStorage.setItem('pt-view', state.view); } catch (err) {}
    applyView();
    renderGrid();
  };
  var TFMT_KEYS = { dhm: 1, hm: 1, h: 1 };
  try { var tf = localStorage.getItem('pt-tfmt'); if (TFMT_KEYS[tf]) { state.tfmt = tf; } } catch (err) {}
  var tfBtns = $('tfmt').getElementsByTagName('button');
  function applyTfmt() {
    for (var i = 0; i < tfBtns.length; i++) {
      var on = tfBtns[i].getAttribute('data-f') === state.tfmt;
      tfBtns[i].className = on ? 'on' : '';
      tfBtns[i].setAttribute('aria-checked', on ? 'true' : 'false');
    }
  }
  applyTfmt();
  for (var ti = 0; ti < tfBtns.length; ti++) {
    tfBtns[ti].onclick = function () {
      state.tfmt = this.getAttribute('data-f');
      try { localStorage.setItem('pt-tfmt', state.tfmt); } catch (err) {}
      applyTfmt();
      renderDashboard();
      renderGrid();
    };
  }
  function syncClear() { $('sbox').className = state.query ? 'sbox has' : 'sbox'; }
  $('q').oninput = function () { state.query = this.value; syncClear(); renderGrid(); };
  $('q').onkeydown = function (e) { if ((e.key === 'Escape' || e.keyCode === 27) && state.query) { this.value = ''; state.query = ''; syncClear(); renderGrid(); } };
  $('qclear').onclick = function () { var q = $('q'); q.value = ''; state.query = ''; syncClear(); renderGrid(); q.focus(); };
  $('reload').onclick = load;
  $('mClose').onclick = closeDetail;
  $('overlay').onclick = function (e) { if (e.target === this) { closeDetail(); } };
  document.onkeydown = function (e) {
    if (e.key === 'Escape' || e.keyCode === 27) {
      if (openGame) { closeDetail(); }
    }
  };

  loadInfo();
  load();
})();
</script>
</body>
</html>
